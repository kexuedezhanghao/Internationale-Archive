name: Validate archive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check generated catalogues without rewriting
        run: |
          python scripts/build_catalogue.py --check
          python scripts/build_book_catalogue.py --check
      - name: Validate provenance, texts, JSON and local links
        run: python scripts/validate.py
      - name: Test generation and search regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/catalogue.test.cjs
      - name: Check whitespace and unexpected generated changes
        run: |
          git diff --check
          git diff --exit-code
